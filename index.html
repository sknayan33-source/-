    <script>
      (function () {
        // 0. Force Immediate Cache & Service Worker Purge on Version 25 Update
        var FORCE_PURGE_KEY = 'sonamonir_cache_purge_v25_publish';
        try {
          if (localStorage.getItem(FORCE_PURGE_KEY) !== 'purged') {
            localStorage.setItem(FORCE_PURGE_KEY, 'purged');
            if ('caches' in window) {
              caches.keys().then(function (names) {
                names.forEach(function (name) {
                  caches.delete(name);
                });
              });
            }
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) {
                  reg.unregister();
                });
              });
            }
          }
        } catch (e) {}

        // 1. Detect standalone app / Edge-to-Edge Android mode immediately
        try {
          if (
            window.matchMedia('(display-mode: standalone)').matches ||
            window.matchMedia('(display-mode: fullscreen)').matches ||
            window.navigator.standalone === true ||
            /android.*wv|android.*version\/[0-9]/i.test(navigator.userAgent)
          ) {
            document.documentElement.classList.add('is-standalone-app');
          }
        } catch (e) {}

        // 2. Capture native PWA install prompt at millisecond 0 before React bundle finishes loading
        window.__deferredPwaPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          window.__deferredPwaPrompt = e;
          window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
        });

        // 3. Register Service Worker v25 with automatic cache invalidation & stale cache purge
        try {
          if (window.self === window.top && 'serviceWorker' in navigator) {
            navigator.serviceWorker
              .register('/sw.js?v=sonamonir_v25', { scope: '/', updateViaCache: 'none' })
              .then(function (reg) {
                reg.update().catch(function () {});
                reg.addEventListener('updatefound', function () {
                  var newWorker = reg.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', function () {
                      if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                        newWorker.postMessage({ type: 'SKIP_WAITING' });
                      }
                    });
                  }
                });
              })
              .catch(function () {});

            var isRefreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
              if (!isRefreshing) {
                isRefreshing = true;
                window.location.reload();
              }
            });
          }
        } catch (err) {}

        // 4. Strict Horizontal Scroll Prevention for Mobile Web & Native App WebView
        var startTouchX = 0;
        var startTouchY = 0;
        window.addEventListener('touchstart', function(e) {
          if (e.touches && e.touches.length > 0) {
            startTouchX = e.touches[0].clientX;
            startTouchY = e.touches[0].clientY;
          }
        }, { passive: true });

        window.addEventListener('touchmove', function(e) {
          if (!e.touches || e.touches.length === 0) return;
          var touchX = e.touches[0].clientX;
          var touchY = e.touches[0].clientY;
          var deltaX = Math.abs(touchX - startTouchX);
          var deltaY = Math.abs(touchY - startTouchY);

          // If child element has horizontal scrollable area (like category badges or video cards), allow internal scroll
          var target = e.target;
          var hasHorizScrollParent = false;
          while (target && target !== document.body && target !== document.documentElement) {
            if (target.scrollWidth > target.clientWidth && (getComputedStyle(target).overflowX === 'auto' || getComputedStyle(target).overflowX === 'scroll')) {
              hasHorizScrollParent = true;
              break;
            }
            target = target.parentElement;
          }

          // If predominantly horizontal movement on the main page, cancel it to prevent web wobble/swiping
          if (!hasHorizScrollParent && deltaX > deltaY && deltaX > 8) {
            if (e.cancelable) {
              e.preventDefault();
            }
          }
        }, { passive: false });
      })();
    </script>
